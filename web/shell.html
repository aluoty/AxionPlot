<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AxionPlot — Graphing Calculator</title>
    <meta name="description" content="Full graphing calculator: Cartesian, parametric, and polar plots in WebAssembly">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #03040a;
        }

        canvas.emscripten {
            display: block;
            outline: none;
            border: 0;
        }

        #status {
            position: fixed;
            left: 12px;
            bottom: 8px;
            color: #8ec8b8;
            opacity: 0.8;
            font: 11px/1.4 monospace;
            pointer-events: none;
            z-index: 1;
            max-width: 90%;
        }
    </style>
</head>
<body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault();" tabindex="-1"></canvas>
    <div id="status">Loading AxionPlot...</div>
    <script type="text/javascript">
        var statusElement = document.getElementById('status');
        var canvas = document.getElementById('canvas');
        var runtimeReady = false;
        var MIN_W = 640;
        var MIN_H = 480;

        function showStatus(text) {
            if (!statusElement) return;
            statusElement.textContent = text;
            statusElement.style.display = 'block';
        }

        function checkWebGL() {
            try {
                var test = document.createElement('canvas');
                return !!(test.getContext('webgl2') || test.getContext('webgl') || test.getContext('experimental-webgl'));
            } catch (e) {
                return false;
            }
        }

        function resizeCanvas() {
            var w = Math.max(MIN_W, window.innerWidth);
            var h = Math.max(MIN_H, window.innerHeight);

            canvas.width = w;
            canvas.height = h;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';

            if (typeof Module !== 'undefined' && Module.setCanvasSize) {
                Module.setCanvasSize(w, h);
            }
            if (runtimeReady && typeof Module !== 'undefined' && Module._AxionWebConfigure) {
                Module._AxionWebConfigure(w, h, 0);
            }
        }

        if (!checkWebGL()) {
            showStatus('WebGL is not available in this browser.');
        }

        var Module = {
            canvas: canvas,
            setStatus: function(text) {
                if (text) showStatus(text);
                else if (statusElement) statusElement.style.display = 'none';
            },
            printErr: function(text) {
                if (text) showStatus(String(text).trim());
            },
            onAbort: function(reason) {
                showStatus('Failed to start: ' + (reason || 'unknown error'));
            },
            preRun: [resizeCanvas],
            onRuntimeInitialized: function() {
                runtimeReady = true;
                resizeCanvas();
                Module.setStatus('');
            }
        };

        canvas.addEventListener('webglcontextlost', function(e) {
            showStatus('WebGL context lost. Please reload the page.');
            e.preventDefault();
        }, false);

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.onerror = function(msg) {
            showStatus('Error: ' + msg);
        };
        Module.setStatus('Downloading...');
    </script>
    {{{ SCRIPT }}}
</body>
</html>
