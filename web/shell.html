<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AxionPlot — Graphing Calculator</title>
    <meta name="description" content="Full graphing calculator: Cartesian, parametric, and polar plots in WebAssembly">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #00ffcc;
            font-family: monospace;
            overflow: hidden;
        }

        canvas.emscripten {
            display: block;
            margin: 0 auto;
            outline: none;
            border: none;
        }

        #status {
            position: fixed;
            left: 10px;
            bottom: 10px;
            opacity: 0.7;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault();" tabindex="-1"></canvas>
    <div id="status">Loading AxionPlot graphing calculator...</div>
    <script type="text/javascript">
        var statusElement = document.getElementById('status');
        var Module = {
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener('webglcontextlost', function(e) {
                    alert('WebGL context lost. Please reload the page.');
                    e.preventDefault();
                }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                if (!statusElement) return;
                if (text) statusElement.textContent = text;
                else statusElement.style.display = 'none';
            }
        };
        window.onerror = function() {
            Module.setStatus('Exception thrown. See JavaScript console.');
        };
        Module.setStatus('Downloading...');
    </script>
    {{{ SCRIPT }}}
</body>
</html>
